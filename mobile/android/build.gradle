allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects { project ->
    def configurePlugin = {
        if (project.hasProperty("android")) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            def packageName = null

            if (manifestFile.exists()) {
                def manifestContent = manifestFile.getText('UTF-8')
                def matcher = (manifestContent =~ /package="([^"]+)"/)
                if (matcher.find()) {
                    packageName = matcher.group(1)
                    // Eliminar el atributo package="..." del AndroidManifest del plugin en .pub-cache para cumplir con AGP 8
                    def updatedContent = manifestContent.replaceFirst(/package="[^"]+"/, "")
                    manifestFile.write(updatedContent, 'UTF-8')
                }
            }

            if (project.android.namespace == null) {
                if (packageName != null) {
                    project.android.namespace = packageName
                } else if (project.name == "ota_update") {
                    project.android.namespace = "sk.fourq.otaupdate"
                } else {
                    project.android.namespace = project.group ?: "com.example.${project.name}"
                }
            }
        }
    }

    if (project.state.executed) {
        configurePlugin()
    } else {
        project.afterEvaluate {
            configurePlugin()
        }
    }
}
