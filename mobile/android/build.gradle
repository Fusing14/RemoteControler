allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects { project ->
    def configureNamespace = {
        if (project.hasProperty("android")) {
            if (project.android.namespace == null) {
                if (project.name == "ota_update") {
                    project.android.namespace = "eu.wroblewscy.marcin.ota_update"
                } else {
                    project.android.namespace = project.group ?: "com.example.${project.name}"
                }
            }
        }
    }

    if (project.state.executed) {
        configureNamespace()
    } else {
        project.afterEvaluate {
            configureNamespace()
        }
    }
}
