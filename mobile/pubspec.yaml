name: remote_controler_mobile
description: "Secure Zero-Trust Remote Control Client for Android/iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  canonical_json: ^1.0.0
  web_socket_channel: ^2.4.1
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^5.1.1
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
